[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated alembic migrations use single-line sa.Column(...) definitions.
"**/database/migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
