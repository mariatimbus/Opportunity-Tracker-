name: Backend CI

on:
  pull_request:
    branches: [develop, main]

# Least-privilege token: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check backend exists
        id: backend
        working-directory: ${{ github.workspace }}
        run: echo "exists=$(test -f apps/api/pyproject.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        if: steps.backend.outputs.exists == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        if: steps.backend.outputs.exists == 'true'
        run: uv sync --all-extras
      - name: Ruff check
        if: steps.backend.outputs.exists == 'true'
        run: uv run ruff check .
      - name: Pytest
        if: steps.backend.outputs.exists == 'true'
        run: uv run pytest
