name: Security CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Least-privilege token: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
      - name: Audit Python dependencies (pip-audit)
        working-directory: apps/api
        # Audits the locked dependency set from uv.lock as installed in the venv.
        run: |
          uv sync --all-extras
          uv run --with pip-audit pip-audit
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Audit root npm dependencies
        run: npm audit --audit-level=high
      - name: Audit web npm dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

  frontend-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check no privileged Supabase keys in frontend source
        # The browser must only ever see the publishable/anon key. Fail the
        # build if a service-role or secret key pattern shows up in apps/web.
        run: |
          ! grep -rEn "service[_-]?role|SUPABASE_(SERVICE|SECRET)" apps/web/src
