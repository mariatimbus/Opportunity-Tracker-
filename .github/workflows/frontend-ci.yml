name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

# Least-privilege token: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check frontend exists
        id: frontend
        working-directory: ${{ github.workspace }}
        run: echo "exists=$(test -f apps/web/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        if: steps.frontend.outputs.exists == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        if: steps.frontend.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.frontend.outputs.exists == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.frontend.outputs.exists == 'true'
        run: npm run typecheck
      - name: Build
        if: steps.frontend.outputs.exists == 'true'
        run: npm run build
