# Alembic migrations for the Opportunity Tracker platform.
# Run from the repo root using the apps/api environment:
#   cd apps/api && DATABASE_URL=... uv run alembic -c ../../database/migrations/alembic.ini upgrade head
# DATABASE_URL defaults to a local sqlite file for smoke tests.

[alembic]
script_location = %(here)s
prepend_sys_path = .
# sqlalchemy.url is overridden in env.py from the DATABASE_URL env var.
sqlalchemy.url = sqlite:///./opportunity_tracker.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
